name: Real footage pilot
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/produce.yml'
permissions:
  contents: read
concurrency:
  group: chickenfarm-real-pilot
  cancel-in-progress: false
jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core fonts-dejavu-core
      - name: Download and render genuine footage
        run: python3 produce_clean.py
      - uses: actions/upload-artifact@v4
        with:
          name: ChickenFarm-fullscreen-9x16
          path: output/
          if-no-files-found: error
          retention-days: 7
